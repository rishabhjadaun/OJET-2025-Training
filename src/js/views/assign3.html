<div>
  <oj-input-text 
      label-hint="Enter your name" 
      value="{{userName}}" 
      required="true"
      on-raw-value-changed="[[onInputChange]]">
  </oj-input-text>

  <oj-button on-oj-action="[[submitForm]]" 
             disabled="[[isButtonDisabled]]">
    Submit
  </oj-button>

</div>
